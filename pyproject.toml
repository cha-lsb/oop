[project]
name = "oop"
version = "0.1.0"
description = "Tiny RPG game"
readme = "README.md"
authors = [
    { name = "cha-lsb", email = "charlotte.lerat1991@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
oop = "oop:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
